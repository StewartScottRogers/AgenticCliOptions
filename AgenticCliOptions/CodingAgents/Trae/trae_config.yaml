agents:
    trae_agent:
        enable_lakeview: false
        model: trae_agent_model
        max_steps: 50
        tools:
            - bash
            - str_replace_based_edit_tool
            - sequentialthinking
            - task_done
allow_mcp_servers: []
mcp_servers: {}
model_providers:
    openai:
        api_key: placeholder
        provider: openai
        base_url: https://openrouter.ai/api/v1
models:
    trae_agent_model:
        model_provider: openai
        model: anthropic/claude-sonnet-5
        max_tokens: 4096
        temperature: 0.5
        top_p: 1
        top_k: 0
        max_retries: 5
        parallel_tool_calls: true
